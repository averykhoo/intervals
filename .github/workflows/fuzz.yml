# randomized fuzzing on every push to master, not in the gate: HYPOTHESIS_PROFILE=fuzz makes
# tests/conftest.py run every hypothesis test randomized with FUZZ_MULTIPLIER (default 10) times its
# gate examples. the ci profile the gate gets is derandomized, so only this job tries new inputs in
# CI. no schedule (the owner, 2026-09-29: it runs autonomously or not at all, and nobody reads a
# scheduled run's email): the same run happens locally before each push (tools/prepush.sh), and the
# session that pushed watches this one (tools/ci_watch.sh). .hypothesis/ (the example database,
# kept under CI by the fuzz profile) is carried between runs, so a failing example found once is
# replayed first by every later run until it is fixed; each one found is pinned as an @example on
# the gate test that found it.
name: fuzz

on:
  push:
    branches: [master]
    # a push of markdown and references/ only cannot change what the fuzz finds (owner, 2026-09-30):
    # skipped, as tools/prepush.sh skips it locally. github skips only if every changed file matches
    paths-ignore: ["**.md", "references/**"]
  workflow_dispatch:
    inputs:
      multiplier:
        description: "times each test's gate max_examples"
        default: "10"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # measured 2026-09-27 at dbec908 on the laptop: the suite at x10 took 84 min (5037 s), and
    # x100 extrapolates to 13-16 h, past the hosted runner's 360-min ceiling. x10 keeps the weekly
    # run cheap; a dispatch above about x20 needs timeout-minutes raised first (360 at most)
    timeout-minutes: 180
    env:
      HYPOTHESIS_PROFILE: fuzz
      FUZZ_MULTIPLIER: ${{ inputs.multiplier || '10' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test]" numpy
      # a cache entry is immutable, so each run saves a fresh key and restores the newest by prefix
      - uses: actions/cache/restore@v4
        with:
          path: .hypothesis
          key: fuzz-hypothesis-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-hypothesis-
      - name: fuzz
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee fuzz.log
      # saved on failure too (the plain cache action saves only on success), so a found example
      # is in the next run's database
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .hypothesis
          key: fuzz-hypothesis-${{ github.run_id }}-${{ github.run_attempt }}
      # a timeout is a cancellation, not a failure, and its log may still hold a found example
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-${{ github.run_id }}-${{ github.run_attempt }}
          # .hypothesis is a hidden directory, which upload-artifact skips unless told otherwise
          include-hidden-files: true
          path: |
            fuzz.log
            .hypothesis/
