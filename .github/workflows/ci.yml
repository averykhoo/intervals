# the gate on every supported python, once more on the gmpy2 backend, and the slow exhaustive differentials
# that are not in the gate.
# hypothesis loads its built-in "ci" profile under GitHub Actions (derandomized, no deadline).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]" numpy
      - run: python -m pytest -q

  # the whole suite again with the gmpy2/MPFR backend forced (owner, Q16(e), 2026-10-03): the linux PyPI wheel's
  # MPFR on every push. forced, `import intervals` raises unless gmpy2 is taken, so the suite cannot pass on the
  # pure path (one test file alone can: the name step checks first). no gmpy2 fuzz job. locally:
  # tools/gate.py run gate:gmpy2 (tests/test_gate_ledger.py pins the match)
  gate-gmpy2:
    name: gate (gmpy2, python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTERVALS_BACKEND: gmpy2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test]" numpy
      - run: python -c "import intervals.backend as b; print(b.name()); assert b.name() == 'gmpy2'"
      - run: python -m pytest -q

  exhaustive:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: exhaustive ops (exact grid)
            args: tests.exhaustive_ops
          - name: exhaustive ops (float grid)
            args: tests.exhaustive_ops --float
          - name: exhaustive ops (sabotage)
            args: tests.exhaustive_ops --sabotage
          - name: exhaustive modulo
            args: tests.exhaustive_modulo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test]"
      - run: python -m ${{ matrix.args }}
