[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multiinterval"
version = "2.0.0.dev0"
description = "Multi-intervals over the affine extended reals, with open/closed endpoints"
requires-python = ">=3.12"

[project.optional-dependencies]
# the gmpy2/mpfr backend (MULTIINTERVAL_BACKEND=gmpy2 or auto; see multiinterval/backend.py): the same doubles, faster.
# pinned to the series `auto` takes, as `test` is (owner, Q16(d), 2026-10-03): a gmpy2 outside it would make
# `auto` run pure silently and `gmpy2` run an unverified series
fast = ["gmpy2>=2.3,<3"]
# gmpy2 is here so that tests/test_backend.py's differential never skips; pinned to the series
# `auto` takes (backend.FLOOR <= version < backend.CEILING), so CI tests what auto would pick
test = ["pytest", "hypothesis", "python-flint>=0.9", "gmpy2>=2.3,<3",
        # numpy for the same reason: tests/test_numpy_compat.py never skips, and README's numpy
        # section runs as doctests. the library itself never needs it (not in `dependencies`)
        "numpy",
        # pandas for the same reason: tests/test_time_pandas.py never skips (the time layer's Timestamp and
        # Timedelta readings and pd.Interval round trips, M8). the library imports it only for to_pandas()
        "pandas"]

[tool.setuptools]
packages = ["multiinterval"]

[tool.pytest.ini_options]
# README.md is collected so its examples are part of the gate
testpaths = ["tests", "multiinterval", "README.md"]
addopts = "--doctest-modules --doctest-glob=README.md"
# "." puts the `multiinterval/` package on sys.path
pythonpath = ["."]
# the library's own warnings are errors inside the suite; a test that provokes one on purpose
# opts out with a filterwarnings mark or pins it with pytest.warns
filterwarnings = ["error::multiinterval.errors.IntervalWarning"]
