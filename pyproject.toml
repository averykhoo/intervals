[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "intervals"
version = "2.0.0.dev0"
description = "Multi-intervals over the affine extended reals, with open/closed endpoints"
requires-python = ">=3.11"

[project.optional-dependencies]
# the gmpy2/mpfr backend (INTERVALS_BACKEND=gmpy2 or auto; see intervals/backend.py): the same doubles, faster
fast = ["gmpy2>=2.3"]
# gmpy2 is here so that tests/test_backend.py's differential never skips
test = ["pytest", "hypothesis", "python-flint>=0.9", "gmpy2>=2.3"]

[tool.setuptools]
packages = ["intervals"]

[tool.pytest.ini_options]
# README.md is collected so its examples are part of the gate
testpaths = ["tests", "intervals", "README.md"]
addopts = "--doctest-modules --doctest-glob=README.md"
# "." puts the `intervals/` package on sys.path; "archive/v1" keeps v1 importable as
# `multi_interval`, the differential oracle for set operations in tests/test_kernel.py
pythonpath = [".", "archive/v1"]
# the library's own warnings are errors inside the suite; a test that provokes one on purpose
# opts out with a filterwarnings mark or pins it with pytest.warns
filterwarnings = ["error::intervals.errors.IntervalWarning"]
